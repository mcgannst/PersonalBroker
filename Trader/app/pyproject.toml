[project]
name = "trader"
version = "0.1.0"
description = "Trader simulation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.35,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "exchange-calendars>=4.5",
  "pandas>=2.2",
  "typer>=0.12",
  "structlog>=24.4",
  "anthropic>=1.0",
]

[project.scripts]
trader = "trader.cli:app"

[project.entry-points."trader.strategies"]
orb_sip = "trader.strategies.orb_sip:OrbSip"
spy_overlay = "trader.strategies.spy_overlay:SpyOverlay"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: uses the PostgreSQL test container (needs Docker Desktop)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "selectolax.*", "testcontainers.*", "respx.*"]
ignore_missing_imports = true
