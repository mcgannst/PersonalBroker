# trader-dev on the shared Docker host (SPEC §15.1), deployed by `bash docker/deploy.sh dev`.
# The image is built on the Mac and shipped with `docker save | ssh ... docker load`, so this file never builds.
# NPM proxy host `trader-dev.sunspinner.ca` forwards to http://trader-dev:8000 over the external `proxy`
# network (Home LAN only access list); no host port is published.
# Secrets come from the env file at run time: $TRADER_ENV_FILE (an absolute path, set by deploy.sh), else
# docker/.env.dev next to this file. Compose reads it on the Mac, so a remote daemon never needs the file.
name: trader-dev

services:
  trader:
    image: trader:dev
    container_name: trader-dev
    env_file: ${TRADER_ENV_FILE:-.env.dev}
    environment:
      APP_ENV: dev
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - trader_dev_logs:/app/logs
    networks:
      - trader_internal
      - proxy
    init: true
    # At least the sum of supervisord's stopwaitsecs (api 15 + worker 60 + options-worker 30 + cron 30), so
    # both workers write their `stopped` heartbeat before Docker kills anything.
    stop_grace_period: 150s
    restart: unless-stopped
    # Resource limits (P5-T16), so the container cannot exhaust the shared Docker host. They cover every
    # process in the container: the API, the worker, cron jobs and a replay subprocess (`trader replay`
    # runs inside this container and shares these limits with the live worker).
    # Memory: 1 GiB, at least 4 x the 256 MB /tmp tmpfs (which counts against it); memswap_limit equal to
    # mem_limit means no swap beyond the limit.
    mem_limit: 1g
    memswap_limit: 1g
    # CPU: at most 2 cores' worth of time.
    cpus: 2.0
    # Processes: at most 256 processes and threads, which stops a fork or thread leak.
    pids_limit: 256
    # Open files per process.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Docker's stdout log: at most 5 files of 10 MB (50 MB). supervisord's own log in the logs volume is
    # capped separately (10 MB x 3).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  trader_dev_logs: {}

networks:
  trader_internal:
    driver: bridge
  proxy:
    external: true
