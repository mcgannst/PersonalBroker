; supervisord for the Trader image (P4-T17): api, worker and cron in one container (SPEC §1, §15).
; It runs as the image's non-root user on a read-only root filesystem: its pid file and control socket live in
; /tmp (tmpfs), its own log in /app/logs (a volume); every program logs to the container's stdout.
;
; Stopping (docker stop -> init -> supervisord): the highest `priority` number stops first, one program at a
; time, so cron stops first (no new job starts), then the options worker, then the worker, then the api. The
; worker gets 60 s: Worker._shutdown waits for the relay's last pump (RELAY_STOP_SECONDS, 15 s) and the
; Telegram bot (poll timeout + BOT_STOP_GRACE_SECONDS, at most 50 + 5 s) side by side, then writes its
; `stopped` heartbeat. The options worker (OPTSIM-T16) gets 30 s: it finishes the part of its step in
; progress, writes its `stopped` heartbeat and releases its lock. The compose files' stop_grace_period
; (150 s) covers the sum of all four stopwaitsecs (15 + 60 + 30 + 30).

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
childlogdir=/tmp
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=/app/.venv/bin/python -m trader.api
priority=100
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
; run-worker.sh forwards the stop signal to `python -m trader.worker` and waits 30 s after exit 2 or 3
; (another worker holds the lock), so a second worker never restarts in a tight loop.
command=/app/docker/run-worker.sh
priority=200
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopwaitsecs=60
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:options-worker]
; The options simulation's own always-on process (OPTSIM): it shares nothing with the stock worker but the
; database. A second copy sleeps 30 s itself before it exits (code 2), so it needs no wrapper script; it
; exits with code 4 when `trader options-run new` changed the active options run, and is restarted on it.
command=/app/.venv/bin/python -m trader.options.worker
priority=250
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
; CRON_TZ in the crontab makes supercronic read the times in America/New_York (Debian tzdata).
command=/usr/local/bin/supercronic -passthrough-logs /app/docker/crontab
priority=300
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
